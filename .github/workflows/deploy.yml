# Builds the Pages artifact: existing static reports stay at the site root,
# the degree planner app is served from /degree-planner/.
#
# NOTE: repo Settings -> Pages -> Source must be set to "GitHub Actions"
# for this workflow to take over deployment.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude _site --exclude app --exclude pipeline \
            --exclude data --exclude node_modules --exclude .git \
            --exclude .github ./ _site/
          mkdir -p _site/degree-planner
          rsync -a app/dist/ _site/degree-planner/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
